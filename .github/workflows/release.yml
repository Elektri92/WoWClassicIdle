name: Build & Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Bump the patch version in version.json and expose the new version to all steps
      - name: Bump version
        id: version
        run: |
          NEW=$(python3 - <<'EOF'
          import json
          with open('version.json') as f:
              v = json.load(f)
          maj, min_, pat = v['version'].split('.')
          pat = str(int(pat) + 1)
          new_ver = f'{maj}.{min_}.{pat}'
          base = f'https://github.com/Elektri92/WoWClassicIdle/releases/download/v{new_ver}'
          v['version']     = new_ver
          v['windows_url'] = f'{base}/WoWClassicIdle-win-x64.exe'
          v['linux_url']   = f'{base}/WoWClassicIdle-linux-x64'
          v['mac_url']     = f'{base}/WoWClassicIdle-osx-x64'
          with open('version.json', 'w') as f:
              json.dump(v, f, indent=2)
          print(new_ver)
          EOF
          )
          echo "value=$NEW" >> $GITHUB_OUTPUT

      # Pass the version explicitly to every publish so AssemblyVersion is embedded correctly
      - name: Publish Linux
        run: dotnet publish WoWClassicIdle -p:PublishProfile=Linux-x64 -p:Version=${{ steps.version.outputs.value }}

      - name: Publish Windows
        run: dotnet publish WoWClassicIdle -p:PublishProfile=Win-x64 -p:Version=${{ steps.version.outputs.value }}

      - name: Publish macOS
        run: dotnet publish WoWClassicIdle -p:PublishProfile=MacOS-x64 -p:Version=${{ steps.version.outputs.value }}

      # Prepare release assets
      # Linux: tar.gz (first install: binary + wwwroot) + binary alone (auto-update)
      # Windows/macOS: single executable
      - name: Prepare release assets
        run: |
          chmod +x publish/linux/WoWClassicIdle
          tar -czf WoWClassicIdle-linux-x64.tar.gz -C publish/linux .
          mv WoWClassicIdle-linux-x64.tar.gz publish/linux/WoWClassicIdle-linux-x64.tar.gz
          cp publish/linux/WoWClassicIdle      publish/linux/WoWClassicIdle-linux-x64
          cp publish/win/WoWClassicIdle.exe    publish/win/WoWClassicIdle-win-x64.exe
          cp publish/mac/WoWClassicIdle        publish/mac/WoWClassicIdle-osx-x64

      # Commit version.json back to main ([skip ci] prevents an endless loop)
      - name: Commit version.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.value }} [skip ci]"
          git push

      # Create the GitHub release and upload the binaries
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: |
            publish/linux/WoWClassicIdle-linux-x64.tar.gz
            publish/linux/WoWClassicIdle-linux-x64
            publish/win/WoWClassicIdle-win-x64.exe
            publish/mac/WoWClassicIdle-osx-x64
